[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-history-interface"
version = "0.2.0"
description = "Read-only access to the current user's local Codex conversations."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["markdown-it-py>=3,<5", "mdit-py-plugins>=0.4,<1"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.scripts]
codex-history = "codex_history_interface.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codex_history_interface = ["py.typed"]
